<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Varni Holidays</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #153650;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .brand-logo-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .brand-logo {
      height: 46px;
      width: auto;
      object-fit: contain;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    p {
      color: #94A3B8;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(233, 185, 94, 0.2);
      border-top-color: #E9B95E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .retry-btn {
      display: none;
      margin-top: 20px;
      background-color: #E9B95E;
      color: #153650;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="brand-logo-container">
    <img src="logo.webp" alt="Varni Holidays" class="brand-logo" />
  </div>
  <p id="status-label">Connecting to Travel Companion...</p>
  <div class="spinner" id="spinner"></div>
  <button class="retry-btn" id="retry-btn" onclick="connect()">Retry Connection</button>

  <script>
    const TARGET_URL = 'https://varni-holidays.vercel.app/app';

    function connect() {
      const spinner = document.getElementById('spinner');
      const retryBtn = document.getElementById('retry-btn');
      const statusLabel = document.getElementById('status-label');

      spinner.style.display = 'block';
      retryBtn.style.display = 'none';
      statusLabel.textContent = 'Connecting to Travel Companion...';

      // Attempt navigation to customer application
      window.location.href = TARGET_URL;

      // If navigation doesn't occur after 6s, show retry
      setTimeout(() => {
        spinner.style.display = 'none';
        retryBtn.style.display = 'inline-block';
        statusLabel.textContent = 'Unable to reach server. Check internet connection.';
      }, 6000);
    }

    // Auto-connect on load
    connect();
  </script>
</body>
</html>
