<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Varni Holidays</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#161616;--dim:#444;--lagoon:#0B4F5C;--aqua:#3FB8AF;--sand:#F6E7C8;--sun:#FFB347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sand:#EBDDBA}}
:root[data-theme="dark"]{--sand:#EBDDBA}
html,body{height:100%;margin:0}
body{background:var(--lagoon);color:var(--sand);font-family:'Archivo',system-ui,sans-serif;overflow:hidden}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#0B4F5C 0%,#1D8587 55%,#7FD1C4 100%)}
.sun{position:absolute;right:12%;bottom:26%;width:min(34vw,300px);aspect-ratio:1;border-radius:50%;background:var(--sun)}
.waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:32%}
nav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,5vw,64px);font-weight:600}
nav a{color:inherit;text-decoration:none;margin-left:26px}
nav a:focus-visible,.cta:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
.copy{position:relative;z-index:2;margin:auto 0;padding:0 clamp(20px,5vw,64px) 14vh;max-width:760px}
h1{font-family:'Archivo Black',Impact,sans-serif;font-weight:400;font-size:clamp(40px,7vw,96px);line-height:1;margin:0 0 18px}
p{font-size:clamp(16px,1.6vw,20px);line-height:1.5;max-width:46ch;margin:0 0 28px}
.cta{display:inline-block;background:var(--sand);color:var(--ink);padding:14px 26px;border-radius:999px;font-weight:600;text-decoration:none}
.rise{opacity:0;transform:translateY(24px)}
body.go .rise{opacity:1;transform:none;transition:opacity .9s ease,transform .9s ease;transition-delay:.9s}
body.go .rise.b{transition-delay:1.1s}
#ov{position:fixed;inset:0;z-index:50;overflow:visible;pointer-events:none}
#s{position:fixed;inset:0;width:100%;height:100%;overflow:visible}
#layers,#holeG{transition:opacity .35s ease}
#holeG{opacity:0}
#cnt{position:fixed;transform:translateX(-100%);color:#fff;font-weight:600;white-space:nowrap;transition:opacity .25s;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){body.go .rise{transition-duration:.01s;transition-delay:0s}}
</style>
</head>
<body>
<main class="hero">
  <nav><strong>Varni Holidays</strong><span><a href="#">Destinations</a><a href="#">Packages</a><a href="#">Contact</a></span></nav>
  <div class="sun"></div>
  <svg class="waves" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 80 Q150 30 300 80 T600 80 T900 80 T1200 80 V200 H0Z" fill="#3FB8AF" opacity=".55"/>
    <path d="M0 120 Q150 70 300 120 T600 120 T900 120 T1200 120 V200 H0Z" fill="#0B4F5C"/>
  </svg>
  <div class="copy">
    <h1 class="rise">Holidays planned around you.</h1>
    <p class="rise b">Tell us where you want to wake up. We’ll handle the flights, stays and everything in between.</p>
    <a class="cta rise b" href="#">Plan my trip</a>
  </div>
</main>

<div id="ov" aria-hidden="true">
  <svg id="s" viewBox="0 0 1400 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="fillclip"><path id="wave" d=""/></clipPath>
      <mask id="hole" maskUnits="userSpaceOnUse" x="-30000" y="-30000" width="60000" height="60000">
        <rect x="-30000" y="-30000" width="60000" height="60000" fill="#fff"/>
        <g id="holeG" fill="#000"><use href="#t1"/><use href="#t2"/></g>
      </mask>
    </defs>
    <rect x="-30000" y="-30000" width="60000" height="60000" fill="#161616" mask="url(#hole)"/>
    <g id="layers">
      <g fill="#444" style="font-family:'Archivo Black',Impact,'Arial Black',sans-serif">
        <text id="t1" x="30" y="300" font-size="357" textLength="1340" lengthAdjust="spacingAndGlyphs">VARNI</text>
        <text id="t2" x="30" y="496" font-size="223" textLength="1340" lengthAdjust="spacingAndGlyphs">HOLIDAYS</text>
      </g>
      <g fill="#fff" clip-path="url(#fillclip)" style="font-family:'Archivo Black',Impact,'Arial Black',sans-serif">
        <use href="#t1"/><use href="#t2"/>
      </g>
    </g>
  </svg>
  <div id="cnt">loading... 0 %</div>
</div>

<script>
const $=id=>document.getElementById(id);
const svg=$('s'),wave=$('wave'),cnt=$('cnt'),ov=$('ov'),W=1400,H=560;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const geom=()=>{const w=innerWidth,h=innerHeight,k=Math.min(w/W,h/H);return{k,ox:(w-W*k)/2,oy:(h-H*k)/2}};
function place(){const g=geom();cnt.style.left=(g.ox+1370*g.k)+'px';cnt.style.top=(g.oy+510*g.k)+'px';cnt.style.fontSize=Math.max(12,18*g.k)+'px'}
function draw(p,t){
  const lv=510-540*p,A=15*(1-Math.pow(p,6));
  let d='M-50 800 L-50 '+lv;
  for(let x=-50;x<=1450;x+=25){
    const y=lv+A*Math.sin(x*.011+t*3.2)+A*.5*Math.sin(x*.023-t*2.1);
    d+=' L'+x+' '+y.toFixed(1);
  }
  wave.setAttribute('d',d+' L1450 800Z');
}
let ready=false;
const pageLoaded=document.readyState==='complete'?Promise.resolve():new Promise(r=>addEventListener('load',r,{once:true}));
Promise.all([document.fonts?document.fonts.ready:null,pageLoaded]).then(()=>ready=true);
const DUR=reduce?600:3600;let t0=null;
function frame(now){
  if(t0===null)t0=now;
  let p=Math.min((now-t0)/DUR,1);
  p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  if(!ready)p=Math.min(p,.99);
  draw(p,now/1000);
  cnt.textContent='loading... '+Math.round(p*100)+' %';
  if(p<1)requestAnimationFrame(frame);else finish();
}
function finish(){
  setTimeout(()=>{
    document.body.classList.add('go');
    if(reduce){ov.remove();document.body.style.overflow='auto';return}
    $('layers').style.opacity=0;$('holeG').style.opacity=1;cnt.style.opacity=0;
    setTimeout(()=>{
      const g=geom();let ox=700;
      try{const e=$('t2').getExtentOfChar(1);ox=e.x+e.width*.1}catch(e){}
      const oy=496-223*.35;
      svg.style.transformOrigin=(g.ox+ox*g.k)+'px '+(g.oy+oy*g.k)+'px';
      const a=svg.animate([{transform:'scale(1,1)'},{transform:'scale(60,42)'}],{duration:1600,easing:'cubic-bezier(.75,0,.25,1)',fill:'forwards'});
      a.onfinish=()=>{ov.remove();document.body.style.overflow='auto'};
    },300);
  },250);
}
addEventListener('resize',place);place();
requestAnimationFrame(frame);
</script>
</body>
</html>
